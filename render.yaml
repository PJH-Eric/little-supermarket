services:
  - type: web
    name: little-supermarket-server
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: GAME_ALLOWED_ORIGIN
        sync: false
      - key: ROOM_IDLE_MS
        value: 1800000
      - key: INVITE_TTL_MS
        value: 86400000
